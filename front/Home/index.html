<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unimaps - home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../../assets/nimaps-1.ico">
    <link href="https://fonts.googleapis.com/css2?family=Lemon:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-primeira-div">
            <img src="../../assets/U.png" alt="">
            <p id="header-paragrafo-unimaps">Unimaps</p>
        </div>
        <button id="deslogarse" onclick="">Sair</button>
    </header>

    <aside>
        <div class="div-elementos-navegacao">
            <img id="Home"    src="../../assets/Home.png"   alt="" onclick="window.location.href='../Home/index.html'">
            <img id="Mapa"    src="../../assets/Mapa.png"   alt="" onclick="window.location.href='../Mapas/index.html'">
            <img id="Chatbot" src="../../assets/chatBot.png"alt="" onclick="window.location.href='../Chat/index.html'">
            <img id="Dica"  src="../../assets/dica.png" alt="" onclick="window.location.href='../Botmap/index.html'">
        </div>
        <div>
            <img id="notificacoes" src="../../assets/noti_ico.png" alt="">
        </div>
    </aside>

    <main>
        <p id="nome_usuario">Seja bem-vindo, Felipe!</p>
        <div class="primeira-div-home">
            <section class="primeira-div-home_atalhos" onclick="window.location.href=''">
                <img src="../../assets/usuario__1_-removebg-preview 2.png" alt="imagem usuario">
                <p>SEU PERFIL</p>
            </section>
            <section class="primeira-div-home_atalhos" onclick="window.location.href='../Botmap/index.html'">
                <img src="../../assets/dica.png" alt="imagem dica">
                <p>DICAS</p>
            </section>
            <section class="primeira-div-home_atalhos" onclick="window.location.href='../'">
                <img src="../../assets/tarefas (2).png" alt="imagem tarefas">
                <p>TAREFAS</p>
            </section>
            <section class="primeira-div-home_atalhos" onclick="window.location.href='../'">
                <img src="../../assets/INFO.png" alt="imagem informacoes">
                <p>INFORMAÇÕES</p>
            </section>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
